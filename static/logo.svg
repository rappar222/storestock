<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Lightning Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>

    <!-- Cart Gradient -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Speed Motion Trails -->
  <path d="M 8 46 L 24 46" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.35" />
  <path d="M 4 58 L 22 58" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" opacity="0.75" />
  <path d="M 8 70 L 24 70" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.35" />

  <!-- Shopping Cart Body -->
  <path d="M 18 28 L 32 28 L 46 70 L 86 70 L 96 40 L 36 40" fill="none" stroke="url(#cartGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cart Wheels -->
  <circle cx="48" cy="82" r="6" fill="#0EA5E9" />
  <circle cx="82" cy="82" r="6" fill="#0EA5E9" />
  <circle cx="48" cy="82" r="2.2" fill="#0F172A" />
  <circle cx="82" cy="82" r="2.2" fill="#0F172A" />

  <!-- Fast Stock Lightning Bolt -->
  <polygon points="74,10 52,38 66,38 60,60 86,28 72,28" fill="url(#boltGrad)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- In-Stock Checkmark Badge -->
  <circle cx="96" cy="22" r="11" fill="#10B981" stroke="#0F172A" stroke-width="3" />
  <path d="M 92 22 L 95 25 L 100 19" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
