services:
  storestock:
    image: storestock:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      # Database Engine Selection (sqlite, postgres, etc.)
      # Default: Ultra-fast local SQLite on /app/data/storestock_cache.db
      - STORESTOCK_DB_TYPE=${STORESTOCK_DB_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      # SMTP Configuration for Feedback Dispatches
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-rappar2018@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-pfklqccstismrxyy}
      - SMTP_FROM=${SMTP_FROM:-rappar2018@gmail.com}
      - SMTP_TLS=${SMTP_TLS:-true}
    volumes:
      # Persist user feedback logs & alerts database on host disk
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
